name: Validate candidate

on:
  workflow_call:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --locked --all-groups --no-install-project --python ${{ matrix.python-version }}

    - name: Build Cython extensions
      run: |
        make build

    - name: Run tests
      run: |
        make test-all

    - name: Generate coverage data
      # Run native tests on every supported Python; measure Cython coverage
      # once on the validated tracing configuration (3.12 tracing is limited).
      if: matrix.python-version == '3.14'
      run: |
        make test-coverage

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Run code quality checks
      run: |
        uv run ruff format --check .
        uv run ruff check .
        make typecheck

  orderbook-extended:
    name: Extended orderbook reference scenarios
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install Python
      run: uv python install 3.15

    - name: Install dependencies
      run: uv sync --locked --all-groups --no-install-project --python 3.15

    - name: Build Cython extensions and test adapter
      run: make build

    - name: Run forty long reference replays through all three targets
      run: |
        PYTHONPATH=src uv run pytest --require-native --orderbook-extended \
          --timeout=600 -q tests/orderbook/test_scenarios.py::test_extended_orderbook_replay
