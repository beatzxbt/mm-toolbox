name: CI

on:
  push:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install build dependencies
      run: |
        uv sync --group build --no-install-project

    - name: Build wheel
      run: |
        make dist

    - name: Check distribution
      run: |
        make check-dist

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-python
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  build-multiplatform:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CIBW_BUILD: "cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-win*"
      CIBW_ARCHS_LINUX: "x86_64 aarch64"
      CIBW_ARCHS_MACOS: "arm64"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install cibuildwheel
      run: |
        uv tool install cibuildwheel

    - name: Set up QEMU (Linux cross-arch builds)
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3

    - name: Print wheel targets
      run: |
        uv tool run cibuildwheel --print-build-identifiers

    - name: Build wheels
      run: |
        uv tool run cibuildwheel --output-dir wheelhouse

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl
        retention-days: 7
