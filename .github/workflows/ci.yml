name: CI

on:
  push:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install build dependencies
      run: |
        uv sync --group build --no-install-project

    - name: Build wheel
      run: |
        make dist

    - name: Check distribution
      run: |
        make check-dist

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-python
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  build-multiplatform:
    name: Build wheels for ${{ matrix.platform.name }} CPython cp${{ matrix['python-tag'] }}
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
        - runner: ubuntu-latest
          arch: x86_64
          name: linux-x86_64
        - runner: ubuntu-24.04-arm
          arch: aarch64
          name: linux-aarch64
        - runner: macos-latest
          arch: arm64
          name: macos-arm64
        python-tag: ["312", "313", "314", "315"]
    env:
      CIBW_BUILD: "cp${{ matrix['python-tag'] }}-*"
      CIBW_SKIP: "*-win*"
      CIBW_ARCHS_LINUX: ${{ matrix.platform.arch }}
      CIBW_ARCHS_MACOS: ${{ matrix.platform.arch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install cibuildwheel
      run: |
        uv tool install 'cibuildwheel>=4.3.4,<5'

    - name: Print wheel targets
      run: |
        uv tool run cibuildwheel --print-build-identifiers

    - name: Build wheels
      run: |
        uv tool run cibuildwheel --output-dir wheelhouse

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.platform.name }}-cp${{ matrix['python-tag'] }}
        path: ./wheelhouse/*.whl
        retention-days: 7
