name: CI

on:
  push:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ main, develop, 'v[0-9]+.[0-9]+*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-groups --no-install-project --python ${{ matrix.python-version }}

    - name: Build Cython extensions
      run: |
        make build-lib

    - name: Run tests
      run: |
        make test-all

    - name: Generate coverage data
      run: |
        make remove-build-lib
        CYTHON_TRACE=1 uv run python setup.py build_ext --inplace --parallel $(nproc 2>/dev/null || uv run python -c 'import os;print(os.cpu_count())')
        uv run pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Run code quality checks
      run: |
        uv run ruff format --check .
        uv run ruff check .
        make typecheck

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install build dependencies
      run: |
        uv sync --group build --no-install-project

    - name: Build wheel
      run: |
        make wheel

    - name: Check distribution
      run: |
        make check-dist

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-python
        path: dist/*.whl
        retention-days: 7

    - name: Upload sdist as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        retention-days: 7

  build-multiplatform:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CIBW_BUILD: "cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-win*"
      CIBW_ARCHS_LINUX: "x86_64 i686 aarch64 ppc64le s390x"
      CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install cibuildwheel
      run: |
        uv tool install cibuildwheel

    - name: Set up QEMU (Linux cross-arch builds)
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3

    - name: Print wheel targets
      run: |
        uv tool run cibuildwheel --print-build-identifiers

    - name: Build wheels
      run: |
        uv tool run cibuildwheel --output-dir wheelhouse

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl
        retention-days: 7
