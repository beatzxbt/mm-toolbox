[project]
name = "mm-toolbox"
version = "1.0.0b10"
description = "High-performance Python tools for market making systems"
readme = "README.md"
authors = [
    { name = "beatzxbt", email = "121855680+beatzxbt@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.16"
license = "MIT"
keywords = ["market making", "hft", "high-frequency trading", "trading", "cython", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed"
]
urls = { homepage = "https://github.com/beatzxbt/mm-toolbox", repository = "https://github.com/beatzxbt/mm-toolbox" }
dependencies = [
    "numpy",
    # Cython extensions access picows object layouts directly. Keep the
    # runtime version identical to the build dependency below.
    "picows==2.3.1",
    "ciso8601",
    "msgspec",
    "aiohttp",
    "xxhash>=3.6.0",
]

[build-system]
requires = [
    "setuptools>=75",
    "wheel",
    "Cython>=3.3.0",
    "numpy>=1.26",
    "picows==2.3.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp315-*"
skip = "*-win* *-manylinux_i686"
test-command = "python {project}/scripts/test_wheel.py {project}"
test-requires = ["pytest", "pytest-asyncio", "pytest-timeout", "websockets", "Cython>=3.3.0", "numpy", "setuptools>=75"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[dependency-groups]
dev = [
    "ty>=0.0.7",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "cython>=3.3.0",
    "uv>=0.13.4",
    "setuptools>=80.9.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "websockets>=12.0",
]
build = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "cibuildwheel>=4.3.4,<5",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "setup.py",
    "conftest.py",
    ".venv/*",
    "build/*",
]
plugins = ["Cython.Coverage"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "boundary: marks boundary condition tests",
    "property: marks property/invariant tests",
    "timeout: marks tests with runtime limits (requires pytest-timeout)",
    "live: marks tests that require live network access",
    "stress: marks tests as stress/load tests",
    "chaos: marks tests with randomized concurrency patterns",
]
